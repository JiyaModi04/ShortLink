<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortly — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* --- RESET & THEME --- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink:       #111010;
  --ink-mute:  #8a8585;
  --cream:     #faf7f2;
  --red:       #c94a2a;
  --border:    #e5e7eb;
  --field-bg:  #f9fafb;
  --rp-bg:     #f4f6f9; /* Soft grey background from screenshot */
  --accent-blue: #2563eb;
}

html, body { 
  height: 100%; 
  font-family: 'Instrument Sans', sans-serif; 
  color: var(--ink); 
  background: var(--rp-bg); /* Background matches your screenshot */
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

/* --- CENTRAL CONTAINER --- */
.container {
  width: 100%;
  max-width: 460px;
  background: #ffffff;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  text-align: center;
}

/* --- LOGO & TITLES --- */
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 38px;
  font-weight: 900;
  margin-bottom: 24px;
  color: var(--ink);
}
.logo span { color: var(--accent-blue); } /* The 'ly' in blue */

h2 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--ink);
}

h4 {
  font-size: 14px;
  font-weight: 400;
  color: var(--ink-mute);
  margin-bottom: 32px;
}

/* --- FORM STYLING --- */
form { text-align: left; }

.field { margin-bottom: 20px; }

.field label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #555;
}

input, select {
  width: 100%;
  padding: 12px;
  background: var(--field-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: all 0.2s ease;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
}

input:focus, select:focus {
  border-color: var(--accent-blue);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
  transform: translateY(-1px);
}

/* --- STRENGTH METER --- */
.strength-track { display: flex; gap: 4px; margin-top: 8px; }
.strength-seg { flex: 1; height: 4px; border-radius: 2px; background: #e5e7eb; transition: 0.3s; }

/* --- BUTTON --- */
.btn-create {
  width: 100%;
  padding: 14px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.25s ease;
  box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
}

.btn-create:hover {
  background: #1d4ed8;
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
}

.login-text {
  margin-top: 24px;
  font-size: 14px;
  color: var(--ink-mute);
}

.login-text a {
  color: var(--accent-blue);
  text-decoration: none;
  font-weight: 600;
}

.login-text a:hover { text-decoration: underline; }

</style>
</head>
<body>

<div class="container">
  <div class="logo">Short<span>ly</span></div>
  <h2>Create Account</h2>
  <h4>Join Shortly and start managing links easily</h4>

  <form action="/" method="post" id="signupForm">
    
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="field">
      <label>Role</label>
      <select name="role" required>
        <option value="" disabled selected>Select role</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" name="password" id="password" placeholder="••••••••" required minlength="6">
      <div class="strength-track">
        <div class="strength-seg" id="s1"></div>
        <div class="strength-seg" id="s2"></div>
        <div class="strength-seg" id="s3"></div>
        <div class="strength-seg" id="s4"></div>
      </div>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <input type="password" name="confirmpassword" id="confirm" placeholder="••••••••" required minlength="6">
    </div>

    <button type="submit" class="btn-create">Create Account</button>
  </form>

  <p class="login-text">
    Already registered? <a href="/login">Login here</a>
  </p>
</div>

<script>
  const pw = document.getElementById('password');
  const segs = ['s1','s2','s3','s4'].map(id => document.getElementById(id));
  
  pw.addEventListener('input', () => {
    const v = pw.value;
    // Simple visual score based on length
    let score = 0;
    if (v.length > 0) score = 1;
    if (v.length > 5) score = 2;
    if (v.length > 8) score = 3;
    if (v.length > 11) score = 4;
    
    segs.forEach((s, i) => {
      // If length is good, use Shortly Red or Accent Blue
      s.style.background = i < score ? '#c94a2a' : '#e5e7eb';
    });
  });
</script>

</body>
</html>
