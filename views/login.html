<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortly — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* --- RESET & THEME --- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink:       #111010;
  --ink-mute:  #8a8585;
  --cream:     #faf7f2;
  --red:       #c94a2a;
  --border:    #e5e7eb;
  --field-bg:  #f9fafb;
  --rp-bg:     #f4f6f9; /* Soft grey background from your theme */
  --accent-blue: #2563eb;
}

html, body { 
  height: 100%; 
  font-family: 'Instrument Sans', sans-serif; 
  color: var(--ink); 
  background: var(--rp-bg); 
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

/* --- CENTRAL CONTAINER --- */
.container {
  width: 100%;
  max-width: 450px;
  background: #ffffff;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  text-align: center;
}

/* --- LOGO & TITLES --- */
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 38px;
  font-weight: 900;
  margin-bottom: 24px;
  color: var(--ink);
}
.logo span { color: var(--accent-blue); }

h2 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--ink);
}

h4 {
  font-size: 14px;
  font-weight: 400;
  color: var(--ink-mute);
  margin-bottom: 32px;
}

/* --- FORM STYLING --- */
form { text-align: left; }

.field { margin-bottom: 20px; }

.field label {
  display: block;
  font-size: 14px;
  font-weight: 700; /* Matching the bold label style */
  margin-bottom: 8px;
  color: #333;
}

input {
  width: 100%;
  padding: 12px;
  background: var(--field-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  transition: all 0.2s ease;
}

input:focus {
  border-color: var(--accent-blue);
  background: #fff;
  box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.2);
}

/* --- BUTTON --- */
.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.25s ease;
}

.btn-login:hover {
  background: #1d4ed8;
}

.footer-text {
  margin-top: 24px;
  font-size: 14px;
  color: var(--ink-mute);
}

.footer-text a {
  color: var(--accent-blue);
  text-decoration: none;
  font-weight: 700;
}

.footer-text a:hover { text-decoration: underline; }

</style>
</head>
<body>

<div class="container">
  <div class="logo">Short<span>ly</span></div>
  <h2>Welcome Back</h2>
  <h4>Login to manage your links and analytics</h4>

  <form action="/login" method="post">
    
    <div class="field">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-login">Login to Dashboard</button>
  </form>

  <p class="footer-text">
    Don't have an account? <a href="/">Register here</a>
  </p>
</div>

</body>
</html>
